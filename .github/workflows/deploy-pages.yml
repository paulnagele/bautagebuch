name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build
        run: |
          # Repository variables/secrets override .env.production when set.
          for name in GOOGLE_CLIENT_ID SUPABASE_URL SUPABASE_ANON_KEY DRIVE_FOLDER_ID; do
            value="$(printenv "CFG_$name" || true)"
            if [ -n "$value" ]; then export "VITE_$name=$value"; fi
          done
          node scripts/check-config.mjs
          npm run build
        env:
          CFG_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          CFG_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          CFG_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          CFG_DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID || secrets.DRIVE_FOLDER_ID }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
