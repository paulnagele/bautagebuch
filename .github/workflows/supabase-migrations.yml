name: Apply Supabase migrations

# Runs before every deployment (deploy-pages.yml), so a new version of the
# app only goes live once its database changes are in place. Can also be
# started by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check settings
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error title=Missing setting $name::Add it as a repository secret."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Fixed, so a new CLI release cannot break the migrations unnoticed.
          version: 2.118.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      # Runs only the migrations the database has not seen yet.
      - run: supabase db push
