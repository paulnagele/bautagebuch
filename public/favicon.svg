<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#f5b301"/>
  <g fill="#1f2328" stroke="#1f2328" stroke-linecap="round" stroke-linejoin="round">
    <!-- tie lines from the peak to both jib ends -->
    <path d="M24 7 L52 16 M24 7 L10 16" fill="none" stroke-width="1.6"/>
    <!-- peak -->
    <path d="M20.5 16 L24 6.5 L27.5 16 Z" stroke-width="1"/>
    <!-- jib and counter-jib -->
    <rect x="7" y="15.5" width="50" height="5" rx="1" stroke="none"/>
    <!-- counterweight -->
    <rect x="9" y="20" width="8" height="7" rx="1" stroke="none"/>
    <!-- mast -->
    <rect x="20.5" y="20" width="7" height="32" stroke="none"/>
    <!-- hoist cable and hook -->
    <path d="M47 20.5 V36" fill="none" stroke-width="2"/>
    <rect x="43.5" y="34" width="7" height="5" rx="1" stroke="none"/>
    <path d="M47 39 V44 a3 3 0 0 1 -6 0" fill="none" stroke-width="2.4"/>
    <!-- base -->
    <rect x="14" y="51" width="20" height="5" rx="1.5" stroke="none"/>
  </g>
  <!-- lattice bracing on the mast -->
  <path d="M21.5 24 L26.5 30 L21.5 36 L26.5 42 L21.5 48" fill="none" stroke="#f5b301" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
